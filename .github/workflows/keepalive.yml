name: Keep Supabase awake

# Free-tier Supabase projects pause after about 7 days without traffic.
# One small query a day keeps the RSVP database live with a wide margin.
#
# The project paused on 2026-09-24 despite a "successful" ping two days
# earlier. The old step never checked the HTTP code, so a rejected ping
# still passed. Now each run retries, and a run that cannot get a 200
# fails red, which emails the repo owner.
#
# GitHub also switches off scheduled workflows after 60 days without a
# commit to the repo. On the 1st of each month this job commits a one-line
# date stamp, which counts as activity and keeps the schedule alive.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether today gets an activity stamp
        id: day
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stamp=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.day.outputs.stamp == 'yes'

      # Runs before the ping so a failed ping can never skip a month's stamp.
      - name: Commit the monthly activity stamp
        if: steps.day.outputs.stamp == 'yes'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/keepalive-stamp.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-stamp.txt
          git commit -m "Keepalive: monthly activity stamp"
          git push

      - name: Ping search_party RPC
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.txt -w "%{http_code}" --max-time 30 -X POST \
              "https://ugweqscwfbxsdecgruqw.supabase.co/rest/v1/rpc/search_party" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"q":"keepalive-ping"}') || code=000
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then exit 0; fi
            cat body.txt 2>/dev/null || true
            sleep 60
          done
          echo "::error::Supabase did not answer the keepalive ping after 5 tries. The RSVP database may be pausing - check the dashboard."
          exit 1
        env:
          # anon key is public by design (also shipped in js/config.js)
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnd2Vxc2N3ZmJ4c2RlY2dydXF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDcyNTksImV4cCI6MjA5Nzg4MzI1OX0.7WBJyPrDkiKgk4fvy49WBcV7Q9cRiDeBdIGDiR1zvyU
